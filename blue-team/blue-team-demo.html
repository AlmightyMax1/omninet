<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OmniNet — Blue Team Engine Demo</title>
<style>
:root{--bg:#06090f;--panel:#0b111c;--line:#16233a;--cyan:#35c4ff;--gold:#ffc94d;--red:#ff4d5e;--green:#3dffa2;--txt:#cfe3ff;--dim:#5a7395}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:13px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);letter-spacing:2px}
header h1{color:var(--cyan);font-size:16px}
header .sub{color:var(--dim);font-size:11px;margin-top:2px}
#btns{display:flex;gap:8px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
#btns button{background:#0e1a2c;border:1px solid var(--line);color:var(--txt);padding:7px 12px;cursor:pointer;font-family:inherit;font-size:12px;border-radius:3px}
#btns button:hover{border-color:var(--cyan);color:#fff}
#status{display:flex;gap:18px;padding:8px 16px;background:#0a0f18;border-bottom:1px solid var(--line);font-size:11px;flex-wrap:wrap;color:var(--dim)}
#status b{color:var(--txt)}
#console{flex:1;overflow-y:auto;padding:12px 16px;line-height:1.55}
.l{font-size:12px;white-space:pre-wrap}
.player{color:var(--dim)}
.low{color:#8fa8c9}.medium{color:var(--gold)}.high{color:#ff9a54}.critical{color:var(--red);font-weight:bold}
.incident{color:var(--red);font-weight:bold}
.goal{color:var(--cyan);font-weight:bold}
.act{color:var(--green)}
.explain{color:var(--gold);font-style:italic;padding-left:18px}
.hdr{color:#fff;letter-spacing:2px;margin-top:10px}
.dim{color:var(--dim)}
.sys{color:var(--cyan)}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
</style>
</head>
<body>
<header>
  <h1>OMNINET // BLUE TEAM ENGINE — LIVE SIM</h1>
  <div class="sub">Sigma-rule inference → utility triage → kill-chain correlation → GOAP planning. No machine learning — an expert system that behaves like a SOC. Requires blue-team-engine.js in the same folder.</div>
</header>
<div id="btns">
  <button onclick="run1()">▶ INTRUSION 1 — Noisy amateur (apexcorp)</button>
  <button onclick="run2()">▶ INTRUSION 2 — Same techniques, next day</button>
  <button onclick="run3()">▶ GHOST RUN — Careful operator (zenithbank)</button>
  <button onclick="cov()">◆ DETECTION COVERAGE REPORT</button>
  <button onclick="location.reload()">RESET AGENT</button>
</div>
<div id="status"></div>
<div id="console"></div>

<script src="blue-team-engine.js"></script>
<script>
'use strict';
const consoleEl=document.getElementById('console');
function log(msg,cls){
  const d=document.createElement('div');
  d.className='l '+(cls||'dim');
  const t=new Date().toLocaleTimeString();
  d.textContent='['+t+'] '+msg;
  consoleEl.appendChild(d);consoleEl.scrollTop=consoleEl.scrollHeight;
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

const agent=new BlueTeam.BlueTeamAgent({
  attention:3, stepInterval:1,
  assetWeights:{apexcorp:1.6,zenithbank:1.4,cryptech:1.2,mediacorp:1.0,gridsys:1.0,noodlenet:0.8},
  onAlert:(a,s)=>log('ALERT ['+a.level.toUpperCase()+'] '+a.name+' · '+a.technique+' ('+BlueTeam.MITRE[a.technique].name+') · conf '+(a.conf*100|0)+'% · triage score '+s.toFixed(1),a.level),
  onIncident:i=>log('⚠ INCIDENT '+i.id+' — '+i.title+' on '+i.node+' · kill chain: '+i.tactics.join(' → ')+' · conf '+(i.conf*100|0)+'%','incident'),
  onGoal:(g,r)=>log('GOAL SELECTED → '+g.label+' ['+g.ir+'] · GOAP plan ('+r.cost+' cost): '+r.plan.map(a=>a.label).join(' → '),'goal'),
  onAction:(a,ctx)=>log('▸ SOC '+a.phase.toUpperCase()+': '+a.label,'act'),
  onExplain:t=>log('“'+t+'”','explain')
});

function updateStatus(){
  const st=agent.status();
  const mem=Object.entries(st.memory).map(([k,v])=>k.replace('@','×')+':'+v).join('  ')||'—';
  document.getElementById('status').innerHTML=
    '<span>GOAL: <b>'+(st.goal||'monitoring')+'</b></span>'+
    '<span>PLAN: <b>'+(st.plan.join(' → ')||'—')+'</b></span>'+
    '<span>INCIDENTS: <b>'+st.incidents.length+'</b></span>'+
    '<span>MEMORY: <b>'+mem+'</b></span>';
}

async function runEvents(evs,label){
  log('═══ '+label+' ═══','hdr');
  for(const ev of evs){
    log('PLAYER ▸ '+ev.type+' → '+ev.node+' (stealth '+ev.stealth+')','player');
    agent.perceive(ev);
    if(ev.note)agent.noteStealth(ev.note);
    agent.tick();
    updateStatus();
    await sleep(650);
  }
  for(let i=0;i<6;i++){ // idle SOC shifts let plans execute
    agent.tick();
    updateStatus();
    await sleep(500);
  }
  log('— shift ends —','dim');
}

function run1(){
  runEvents([
    {type:'scan', node:'apexcorp', stealth:0.10, technique:'T1046'},
    {type:'brute', node:'apexcorp', stealth:0.15, attempts:224, technique:'T1110'},
    {type:'sqli',  node:'apexcorp', stealth:0.25, requests:14, technique:'T1190'},
    {type:'exfil', node:'apexcorp', stealth:0.20, gb:1.4, technique:'T1041'}
  ],'INTRUSION 1 — the noisy amateur hits ApexCorp');
}

function run2(){
  runEvents([
    {type:'scan',  node:'apexcorp', stealth:0.30, technique:'T1046'},
    {type:'brute', node:'apexcorp', stealth:0.35, attempts:231, technique:'T1110'},
    {type:'sqli',  node:'apexcorp', stealth:0.40, requests:9, technique:'T1190'}
  ],'INTRUSION 2 — same playbook, next day (case memory engaged)');
}

function run3(){
  runEvents([
    {type:'scan',  node:'zenithbank', stealth:0.50, technique:'T1046', note:0.3},
    {type:'phish', node:'zenithbank', stealth:0.50, volume:38, technique:'T1566', note:0.3},
    {type:'brute', node:'zenithbank', stealth:0.45, attempts:180, technique:'T1110', note:0.3}
  ],'GHOST RUN — a careful operator probes ZenithBank');
}

function cov(){
  const r=agent.coverageReport();
  log('═══ DETECTION COVERAGE REPORT ═══','hdr');
  log('Covered techniques: '+r.covered.join(', '),'sys');
  log(r.gaps.length?('BLIND SPOTS (no Sigma rule): '+r.gapNames.join(', ')+' — the player can exploit these until rules are authored'):'No blind spots — full ATT&CK-subset coverage','sys');
}

log('Blue Team Agent online. Six-layer engine armed: blackboard, perception, Sigma rules, utility triage, kill-chain correlation, GOAP.','sys');
log('Run an intrusion. Watch how the same alert stream produces different goals as the world changes.','dim');
updateStatus();
</script>
</body>
</html>
